[build]
  command = "npm run build"
  publish = "client/dist"
  functions = "netlify/functions"

[build.environment]
  # .env.example is a checked-in template with placeholder values (e.g. MONGODB_DB_NAME's
  # sample value "tancs_dev") — it can never contain a real secret, but Netlify's build-time
  # secrets scanner flags it anyway since that placeholder happens to match the real
  # (non-secret) MONGODB_DB_NAME value set on this site. Excluding just this one file keeps
  # the scanner active for everything else.
  SECRETS_SCAN_OMIT_PATHS = ".env.example"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
