[build]
  command = "npm run build"
  publish = "client/dist"
  functions = "netlify/functions"

[build.environment]
  # .env.example is a checked-in template with placeholder values — it can never contain a
  # real secret, but Netlify's build-time secrets scanner still checks it against whatever
  # env vars happen to be set on the site. Excluding it keeps the scanner active everywhere
  # else. (Note for future edits to this file: avoid typing any real env var's actual value
  # here, even in a comment — the scanner isn't limited to .env.example, it checks every
  # file, including this one.)
  SECRETS_SCAN_OMIT_PATHS = ".env.example"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
